<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tema por classe</title>
<style>
  :root { --texto: #1f2933; --fundo: #ffffff; }
  .dark { --texto: #52606d; --fundo: #1f2933; }
  body { margin: 0; padding: 16px; font: 16px/1.5 system-ui, sans-serif; color: var(--texto); background: var(--fundo); }
  h1 { font-size: 28px; margin: 0 0 16px; }
</style>
</head>
<body>
<h1>Tema por classe</h1>
<p>O tema escuro deste app liga com a classe dark na raiz, sem media query.</p>
</body>
</html>
