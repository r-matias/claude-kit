<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; display: flex; flex-direction: column; font: 16px/1.5 system-ui, sans-serif; color: #1f2933; background: #ffffff; }
  header { padding: 16px; border-bottom: 1px solid #7b8794; }
  h1 { font-size: 28px; margin: 0; }
  main { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
  section { height: 90vh; margin-bottom: 16px; border: 1px solid #7b8794; border-radius: 8px; padding: 16px; }
  /* Variante de componente, nao tema: a captura nao pode tratar como tema escuro. */
  .cartao.dark { background: #1f2933; color: #ffffff; }
</style>
</head>
<body>
<header><h1>Painel</h1></header>
<main>
  <section><h2>Vendas</h2><p>Primeira parte do painel.</p></section>
  <section><h2>Estoque</h2><p>Segunda parte do painel.</p></section>
  <section><h2>Entregas</h2><p>Terceira parte do painel.</p></section>
</main>
</body>
</html>
