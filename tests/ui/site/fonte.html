<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fonte de sistema</title>
<style>
  @font-face { font-family: "Fraunces Kit"; src: local("Nao Existe Kit"); }
  body { margin: 0; font: 16px/1.5 "Fraunces Kit", Arial, sans-serif; color: #1f2933; background: #ffffff; }
  main { padding: 16px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 32px; margin: 0 0 16px; }
  .destaque { color: #0b5cad; }
  .sem-reserva { font-family: "Fraunces Kit"; }
  .pilha-padrao { font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; }
</style>
</head>
<body>
<main>
  <h1>Resumo do mês</h1>
  <p>Os pedidos fecharam acima da meta, com <span class="destaque">doze por cento</span> a mais que no mês anterior.</p>
  <p>A família declarada primeiro não carrega: o texto sai na fonte de reserva.</p>
  <p class="sem-reserva">Sem reserva declarada.</p>
  <p class="pilha-padrao">Pilha padrão de biblioteca, terminada em fonte de emoji.</p>
</main>
</body>
</html>
