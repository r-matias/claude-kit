<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 16px/1.5 system-ui, sans-serif; color: #1f2933; background: #ffffff; }
  h1 { font-size: 28px; margin: 0 0 16px; }
  form { display: grid; gap: 12px; max-width: 360px; }
  label { display: grid; gap: 4px; font-weight: 600; }
  input { width: 100%; padding: 10px; border: 1px solid #7b8794; border-radius: 6px; font: inherit; }
  button { padding: 12px 20px; border: 0; border-radius: 6px; background: #0b5cad; color: #ffffff; font: inherit; }
</style>
</head>
<body>
<h1>Entrar</h1>
<form method="post" action="/sessao">
  <label>E-mail <input type="email" name="email" autocomplete="username"></label>
  <label>Senha <input type="password" name="senha" autocomplete="current-password"></label>
  <button type="submit">Entrar</button>
</form>
</body>
</html>
